<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스몰 힐링 뽀모도로</title>
  <meta name="description" content="뽀모도로 타이머 + 감정 일기장 + AI 일기 Q&A">
  <style>
    :root { --cream: #faf7f2; --pink: #ffd9e8; --pink-dark: #ff9ec7; --ink: #2c2725; --ink-soft: #7f7471; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--cream); color: var(--ink); padding: 16px;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    .card {
      width: 100%; max-width: 380px; background: #fff; border-radius: 24px; padding: 40px 28px;
      text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }
    .emoji { font-size: 56px; }
    h1 { font-size: 22px; margin: 12px 0 8px; }
    p { color: var(--ink-soft); line-height: 1.6; margin: 0 0 24px; font-size: 15px; }
    a.btn {
      display: block; padding: 16px; border-radius: 16px; background: var(--pink-dark); color: #fff;
      text-decoration: none; font-weight: 700; font-size: 16px;
    }
    a.btn:hover { filter: brightness(.96); }
    small { display: block; margin-top: 16px; color: var(--ink-soft); font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji">🍅🌿</div>
    <h1>스몰 힐링 뽀모도로</h1>
    <p>집중 타이머와 감정 일기장,<br>그리고 내 일기에 답해주는 AI까지</p>
    <a class="btn" id="go" href="https://script.google.com/macros/s/AKfycbyRSqnP3ue5qLB5dtybYkHNt3F0RrRUVN7OMgj9xSQF14-0rX5djwXyMF4GvGdsgsjY/exec">앱 시작하기 →</a>
    <small>잠시 후 자동으로 이동해요 · 구글 로그인이 필요해요</small>
  </main>
  <script>
    setTimeout(function () { location.href = document.getElementById('go').href; }, 1500);
  </script>
</body>
</html>
